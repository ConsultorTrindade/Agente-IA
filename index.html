<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultor Trindade</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { margin: 0; padding: 0; background: #f0f2f5; font-family: 'Segoe UI', Tahoma, sans-serif; }
        #chat-widget { position: fixed; bottom: 20px; right: 20px; width: 350px; height: 500px; display: flex; flex-direction: column; background: white; box-shadow: 0 4px 20px rgba(0,0,0,0.2); border-radius: 12px; border: 1px solid #ddd; overflow: hidden; z-index: 9999; }
        #chat-header { background: #1a2a6c; color: white; padding: 12px; display: flex; align-items: center; gap: 10px; }
        #chat-header img { width: 35px; height: 35px; border-radius: 50%; background: white; object-fit: contain; padding: 2px; }
        #chat-header span { font-weight: bold; font-size: 16px; }
        .wa-btn { background: #25d366; color: white; text-align: center; text-decoration: none; padding: 12px; font-size: 14px; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; border-bottom: 2px solid #1ead5b; transition: 0.3s; }
        .wa-btn:hover { background: #1ebd5e; }
        #chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: #e5ddd5; }
        .message { padding: 10px 14px; border-radius: 10px; font-size: 14px; line-height: 1.4; max-width: 85%; box-shadow: 0 1px 2px rgba(0,0,0,0.1); word-wrap: break-word; white-space: pre-wrap; }
        .user { background: #dcf8c6; align-self: flex-end; }
        .bot { background: white; align-self: flex-start; }
        .typing-indicator { background: white; align-self: flex-start; padding: 10px 14px; border-radius: 10px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 4px; }
        .typing-indicator span { width: 8px; height: 8px; background: #aaa; border-radius: 50%; animation: bounce 1.2s infinite; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }
        #input-area { display: flex; padding: 12px; background: white; border-top: 1px solid #ddd; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 20px; outline: none; font-size: 14px; }
        button { background: #1a2a6c; color: white; border: none; padding: 8px 18px; margin-left: 5px; border-radius: 20px; cursor: pointer; font-weight: bold; transition: opacity 0.2s; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

<div id="chat-widget">
    <div id="chat-header">
<img src="logo-trindade.png" alt="Logo Trindade">
        <span>Consultor Trindade</span>
    </div>
    
    <a href="https://wa.me/555133778417?text=Olá,%20falei%20com%20o%20Consultor%20Trindade." target="_blank" class="wa-btn">
        FALE CONOSCO <i class="fab fa-whatsapp" style="font-size: 18px;"></i>
    </a>

    <div id="chat-container"></div>

    <div id="input-area">
        <input type="text" id="userInput" placeholder="Sua dúvida técnica...">
        <button id="sendBtn" onclick="sendMessage()">Ok</button>
    </div>
</div>

<script>
    const container = document.getElementById('chat-container');
    const input = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    
    let historicoChat = [];

    function addMessage(text, role) {
        const div = document.createElement('div');
        div.className = `message ${role}`;
        div.textContent = text;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    function showTyping() {
        const typing = document.createElement('div');
        typing.className = 'typing-indicator';
        typing.id = 'typing';
        typing.innerHTML = '<span></span><span></span><span></span>';
        container.appendChild(typing);
        container.scrollTop = container.scrollHeight;
    }

    function hideTyping() {
        const typing = document.getElementById('typing');
        if (typing) typing.remove();
    }

    async function sendMessage() {
        const text = input.value.trim();
        if (!text) return;

        sendBtn.disabled = true;
        input.disabled = true;
        addMessage(text, 'user');
        
        input.value = '';
        showTyping();

        try {
            const res = await fetch('https://agente-ia-sepia.vercel.app/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text, history: historicoChat })
            });

            const data = await res.json();
            hideTyping();
            addMessage(data.response, 'bot');

            historicoChat.push({ role: "user", content: text });
            historicoChat.push({ role: "assistant", content: data.response });

            if (historicoChat.length > 10) historicoChat = historicoChat.slice(-10);

        } catch (e) {
            hideTyping();
            addMessage('Conexão instável. Use o botão verde acima.', 'bot');
        } finally {
            sendBtn.disabled = false;
            input.disabled = false;
            input.focus();
        }
    }

    input.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
    
    addMessage('Olá! Sou o Consultor Trindade. Como posso ajudar?', 'bot');
</script>

</body>
</html>
