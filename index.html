<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultor Trindade</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        
        #chat-widget { 
            position: fixed; bottom: 20px; right: 20px; width: 350px; height: 500px; 
            display: flex; flex-direction: column; background: white; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.2); border-radius: 16px; 
            border: 1px solid #ddd; overflow: hidden; z-index: 9999; 
        }
        
        #chat-header { 
            background: #1a2a6c; color: white; padding: 12px; 
            display: flex; align-items: center; gap: 10px; 
        }
        #chat-header img { 
            width: 35px; height: 35px; border-radius: 50%; 
            background: white; object-fit: contain; padding: 2px; 
        }
        #chat-header span { font-weight: bold; font-size: 16px; }
        
        .wa-btn { 
            background: #25d366; color: white; text-align: center; text-decoration: none; 
            padding: 12px; font-size: 14px; font-weight: bold; display: flex; 
            align-items: center; justify-content: center; gap: 8px; 
            border-bottom: 2px solid #1ead5b; transition: 0.3s; 
        }
        .wa-btn:hover { background: #1ebd5e; }
        
        #chat-container { 
            flex: 1; overflow-y: auto; padding: 15px; display: flex; 
            flex-direction: column; gap: 10px; background: #e5ddd5; 
        }
        
        .message { 
            padding: 10px 14px; font-size: 14px; line-height: 1.4; max-width: 85%; 
            box-shadow: 0 1px 2px rgba(0,0,0,0.1); word-wrap: break-word; white-space: pre-wrap; 
        }
        .user { background: #dcf8c6; align-self: flex-end; border-radius: 10px 10px 0 10px; color: #333;}
        .bot { background: white; align-self: flex-start; border-radius: 10px 10px 10px 0; color: #333;}
        
        .typing-indicator { 
            background: white; align-self: flex-start; padding: 10px 14px; 
            border-radius: 10px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); 
            display: flex; align-items: center; gap: 4px; 
        }
        .typing-indicator span { 
            width: 8px; height: 8px; background: #aaa; border-radius: 50%; 
            animation: bounce 1.2s infinite; 
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }
        
        #input-area { display: flex; padding: 12px; background: white; border-top: 1px solid #ddd; }
        input { 
            flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 20px; 
            outline: none; font-size: 14px; 
        }
        button { 
            background: #1a2a6c; color: white; border: none; padding: 8px 18px; 
            margin-left: 5px; border-radius: 20px; cursor: pointer; font-weight: bold; 
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
